name: Linux native port
on:
  push:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Import and cache checks (synthetic data only)
        run: |
          python3 -m unittest discover -s tests/linux -v
          python3 -m compileall -q tools/desktop tools/linux
      - name: Build ROM-free compiler and desktop package
        run: tools/linux/build.sh
      - name: Check compiler relocation
        run: |
          LD_LIBRARY_PATH="$PWD/artifacts/compiler/lib" artifacts/compiler/bin/ps2_recomp --help
          test -f artifacts/compiler/manifest.json
      - name: Generated tail jumps respect hooks (original synthetic ELF)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder python3 tools/linux/test_tail_dispatch.py --out artifacts/tail-dispatch-ci
      - name: Native fidelity, vector contexts and callback stacks (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1600m --memory-swap=1600m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_fidelity.sh
          docker run --rm --init --cpus=2 --memory=1600m --memory-swap=1600m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_scheduler.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_desktop_input.sh
      - name: Keyboard and mouse profile editor (frozen GTK, no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder xvfb-run -a -s '-screen 0 1280x800x24' \
            python3 tools/linux/test_desktop_controls.py \
            --program dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC --out artifacts/desktop-controls-ci
      - name: GPU sampler transitions and dynamic palette uploads (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e LP_NUM_THREADS=2 -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_texture_filters.sh
      - name: Character call frames and campaign effects (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_chara_state.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_campaign_graphics.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e LP_NUM_THREADS=2 -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_renderer_colours.sh
      - name: Native memory-card persistence (synthetic data)
        run: |
          docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder python3 tools/linux/test_memory_card.py \
            --program /src/artifacts/compiler-check --out /src/artifacts/card-persistence
      - name: Fullscreen and GPU shader checks (no ROM)
        run: |
          docker build -t sotc-linux-clean -f tools/linux/Test.Dockerfile .
          for geometry in 1920x1080 2560x1080; do
            docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
              sotc-linux-clean xvfb-run -a -s "-screen 0 ${geometry}x24" \
              /src/artifacts/compiler/bin/sotc-video-tool --self-test /src/artifacts/video-$geometry
            python3 tools/linux/check_video.py artifacts/video-$geometry
          done
      - name: Launcher artwork and navigation pages (no ROM)
        run: |
          python3 tools/linux/test_desktop_services.py --program dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC --out artifacts/desktop-services-ci
          for asset in hero.png icon.png; do
            cmp tools/desktop/assets/$asset dist/ShadowOfTheColossusPC/_internal/assets/$asset
          done
          for page in home graphics controls about; do
            docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
              sotc-linux-clean xvfb-run -a -s '-screen 0 1920x1080x24' \
              /src/dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC \
              --data-dir /src/artifacts/launcher-ci --page "$page" --screenshot "/src/artifacts/launcher-ci/$page.png"
            test -s "artifacts/launcher-ci/$page.png"
          done
      - name: Package content check
        run: |
          test -f dist/ShadowOfTheColossusPC-0.2.7-linux-x86_64.tar.gz
          cd dist
          sha256sum -c ShadowOfTheColossusPC-0.2.7-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowOfTheColossusPC-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
