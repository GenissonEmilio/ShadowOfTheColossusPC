name: Linux native port
on:
  push:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Import, cache and desktop shortcut checks (synthetic data only)
        run: |
          # Discovery includes test_shortcut.py (canonical updates and portable fallback).
          python3 -m unittest discover -s tests/linux -v
          python3 -m compileall -q tools/desktop tools/linux
      - name: Build ROM-free compiler and desktop package
        run: tools/linux/build.sh
      - name: Check compiler relocation
        run: |
          LD_LIBRARY_PATH="$PWD/artifacts/compiler/lib" artifacts/compiler/bin/ps2_recomp --help
          test -f artifacts/compiler/manifest.json
      - name: Native fidelity, vector contexts and callback stacks (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1600m --memory-swap=1600m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_fidelity.sh
          docker run --rm --init --cpus=2 --memory=1600m --memory-swap=1600m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_scheduler.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_desktop_input.sh
      - name: Save-state round trips, failure handling and temporal graphics (no ROM)
        run: |
          for check in test_host_menu_states test_save_state_components test_subsystem_states test_renderer_states test_runtime_states; do
            docker run --rm --init --cpus=2 --memory=1600m --memory-swap=1600m --network=none \
              -u "$(id -u):$(id -g)" -e HOME=/tmp -e LP_NUM_THREADS=2 -v "$PWD:/src:z" \
              sotc-linux-builder bash "tools/linux/${check}.sh"
          done
      - name: Keyboard and mouse profile editor (frozen GTK, no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder xvfb-run -a -s '-screen 0 1280x800x24' \
            python3 tools/linux/test_desktop_controls.py \
            --program dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC --out artifacts/desktop-controls-ci
      - name: GPU sampler transitions and dynamic palette uploads (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e LP_NUM_THREADS=2 -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_texture_filters.sh
      - name: Character call frames and campaign effects (no ROM)
        run: |
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_chara_state.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_campaign_graphics.sh
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e LP_NUM_THREADS=2 -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_renderer_colours.sh
      - name: Transfer palette selection before and after (no ROM)
        run: |
          baseline=83d8eff3c72902822c673dd60709e601777459bd
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:game/overrides/sotc_native.cpp" > artifacts/transfer-palette-baseline.cpp
          set +e
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            -e SOTC_NATIVE_TEST_SOURCE=/src/artifacts/transfer-palette-baseline.cpp \
            -e SOTC_PALETTE_TEST_OUT=artifacts/transfer-palette-before \
            sotc-linux-builder bash tools/linux/test_transfer_palette.sh \
            > artifacts/transfer-palette-before.log 2>&1
          before_status=$?
          set -e
          cat artifacts/transfer-palette-before.log
          test "$before_status" -eq 1
          test -x artifacts/transfer-palette-before/check
          grep -Fx 'Compiled transfer-palette fixture' artifacts/transfer-palette-before.log
          grep -Fx 'FAIL: 4-bit fast/reference decoders use active transfer colours and zero alpha' artifacts/transfer-palette-before.log
          grep -Fx 'FAIL: in-place alpha fade changes the key and upload while file CLUT stays fixed' artifacts/transfer-palette-before.log
          grep -Fx 'PASS: uninitialized work falls back to the file palette' artifacts/transfer-palette-before.log
          grep -Fx 'PASS: direct RGBA textures do not require any CLUT work' artifacts/transfer-palette-before.log
          grep -E '^FAIL: [0-9]+ transfer-palette checks, [1-9][0-9]* failures$' artifacts/transfer-palette-before.log
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_transfer_palette.sh \
            | tee artifacts/transfer-palette-after.log
      - name: Particle material contract before and after (no ROM)
        run: |
          baseline=4396d9981d76a74118b14f82f22993a99a5adcba
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:game/overrides/sotc_native.cpp" > artifacts/particle-baseline.cpp
          set +e
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            -e SOTC_NATIVE_TEST_SOURCE=/src/artifacts/particle-baseline.cpp \
            -e SOTC_PARTICLE_TEST_OUT=artifacts/particle-before \
            sotc-linux-builder bash tools/linux/test_particle_fidelity.sh \
            > artifacts/particle-before.log 2>&1
          before_status=$?
          set -e
          cat artifacts/particle-before.log
          test "$before_status" -eq 1
          test -x artifacts/particle-before/check
          grep -Fx 'Compiled particle-fidelity fixture' artifacts/particle-before.log
          grep -Fx 'FAIL: normal particles test scene depth without writing Z' artifacts/particle-before.log
          grep -Fx 'FAIL: unit particle extents clamp both axes like the material packet' artifacts/particle-before.log
          grep -Fx 'PASS: additive streak retains its blend and six vertices' artifacts/particle-before.log
          grep -Fx 'PASS: both original functions receive unchanged inputs exactly once per draw' artifacts/particle-before.log
          grep -E '^FAIL: [0-9]+ particle-fidelity checks, [1-9][0-9]* failures$' artifacts/particle-before.log
          docker run --rm --init --cpus=2 --memory=1000m --memory-swap=1000m --network=none \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder bash tools/linux/test_particle_fidelity.sh \
            | tee artifacts/particle-after.log
      - name: Native memory-card persistence (synthetic data)
        run: |
          docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
            sotc-linux-builder python3 tools/linux/test_memory_card.py \
            --program /src/artifacts/compiler-check --out /src/artifacts/card-persistence
      - name: Fullscreen and GPU shader checks (no ROM)
        run: |
          docker build -t sotc-linux-clean -f tools/linux/Test.Dockerfile .
          for geometry in 1920x1080 2560x1080; do
            docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
              sotc-linux-clean xvfb-run -a -s "-screen 0 ${geometry}x24" \
              /src/artifacts/compiler/bin/sotc-video-tool --self-test /src/artifacts/video-$geometry
            python3 tools/linux/check_video.py artifacts/video-$geometry
          done
      - name: Launcher artwork and navigation pages (no ROM)
        run: |
          python3 tools/linux/test_desktop_services.py --program dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC --out artifacts/desktop-services-ci
          for asset in hero.png icon.png; do
            cmp tools/desktop/assets/$asset dist/ShadowOfTheColossusPC/_internal/assets/$asset
          done
          for page in home graphics controls about; do
            docker run --rm --init --cpus=2 --network=none -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:z" \
              sotc-linux-clean xvfb-run -a -s '-screen 0 1920x1080x24' \
              /src/dist/ShadowOfTheColossusPC/ShadowOfTheColossusPC \
              --data-dir /src/artifacts/launcher-ci --page "$page" --screenshot "/src/artifacts/launcher-ci/$page.png"
            test -s "artifacts/launcher-ci/$page.png"
          done
      - name: Package content check
        run: |
          test -f dist/ShadowOfTheColossusPC-0.2.8-linux-x86_64.tar.gz
          cd dist
          sha256sum -c ShadowOfTheColossusPC-0.2.8-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowOfTheColossusPC-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
