name: Windows native port
on:
  push:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p ffmpeg:p zlib:p
            python:p python-gobject:p python-cairo:p gtk3:p SDL2:p libarchive:p
      - name: Build ROM-free native runtime and launcher
        run: |
          cmake -S PS2Recomp -B build/windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-msse4.1 \
            -DPython3_EXECUTABLE="$(cygpath -am /ucrt64/bin/python.exe)" \
            -DPS2X_BUILD_WINDOWS_KIT=ON -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF \
            -DPS2X_ENABLE_IOP_RPC_TRACE=OFF
          cmake --build build/windows --parallel 2 --target \
            ps2_recomp sotc-windows-base sotc-video-tool sotc-input-tool ShadowOfTheColossusPC
      - name: Package native launcher and compiler
        run: |
          /ucrt64/bin/python.exe -X utf8 tools/windows/package.py --build build/windows --prefix /ucrt64 --destination dist/windows
      - name: Relocate package outside the source tree
        id: relocated
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/windows/*.zip).FullName
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive).Hash -ne $expected) { throw 'Package SHA-256 mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'SotC relocated package'
          Expand-Archive -LiteralPath $archive -DestinationPath $testRoot
          "SOTC_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
      - name: Open the relocated launcher in English and Japanese
        if: ${{ !cancelled() && steps.relocated.outcome == 'success' }}
        shell: pwsh
        run: |
          $testRoot = $env:SOTC_TEST_ROOT
          $program = Join-Path $testRoot 'ShadowOfTheColossusPC'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $shots = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-launcher'
          New-Item -Path $shots -ItemType Directory -Force | Out-Null
          foreach ($language in @('en', 'ja')) {
            $profile = Join-Path $testRoot "player-$language"
            $image = Join-Path $shots "home-$language.png"
            New-Item -Path $profile -ItemType Directory -Force | Out-Null
            @{ language = $language } | ConvertTo-Json |
              Set-Content -Encoding utf8NoBOM (Join-Path $profile 'launcher-preferences.json')
            $launcher = Start-Process -FilePath "$program/ShadowOfTheColossusPC.exe" -PassThru `
              -ArgumentList "--data-dir `"$profile`" --page home --screenshot `"$image`""
            $finished = $launcher.WaitForExit(60000)
            if (!$finished) {
              & "$env:SystemRoot\System32\taskkill.exe" /PID $launcher.Id /T /F | Out-Null
            }
            $log = Join-Path $profile 'last-launcher.log'
            if (Test-Path $log) { Copy-Item $log (Join-Path $shots "launcher-$language.log") }
            if (!$finished) { throw 'Launcher timed out' }
            if ($launcher.ExitCode -ne 0 -or !(Test-Path $image) -or (Get-Item $image).Length -le 1000) {
              Get-Content $log -ErrorAction SilentlyContinue
              throw "Launcher screenshot ($language) failed, exit code $($launcher.ExitCode)"
            }
          }
          if ((Get-FileHash "$shots/home-en.png").Hash -eq (Get-FileHash "$shots/home-ja.png").Hash) {
            throw 'English and Japanese launcher screenshots were identical'
          }
      - name: Compile and run a fixture with the relocated kit
        if: ${{ !cancelled() && steps.relocated.outcome == 'success' }}
        shell: pwsh
        run: |
          $program = Join-Path $env:SOTC_TEST_ROOT 'ShadowOfTheColossusPC'
          $bin = Join-Path $program 'compiler/toolchain/bin'
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = Join-Path $program 'compiler/toolchain'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          & "$bin/python.exe" -X utf8 tools/linux/test_compiler.py --program $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$program/compiler/bin/ps2_recomp.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Windows launcher screenshots
          path: artifacts/windows-launcher/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        # Keep candidates for diagnosis. Only successful builds are released.
        if: ${{ !cancelled() }}
        with:
          name: ShadowOfTheColossusPC-windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: ignore
