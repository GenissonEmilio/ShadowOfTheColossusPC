name: Windows native port
on:
  push:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '.recomp.json']
  workflow_dispatch:
    inputs:
      compiler_version:
        description: 'Prior published version (e.g. v1.2.0) for a launcher-only package'
        type: string
      compiler_sha256:
        description: 'SHA-256 of the prior published Windows ZIP'
        type: string
      compiler_build_id:
        description: 'build_id from the prior published Windows compiler manifest'
        type: string
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      COMPILER_VERSION: ${{ inputs.compiler_version }}
      COMPILER_SHA256: ${{ inputs.compiler_sha256 }}
      COMPILER_BUILD_ID: ${{ inputs.compiler_build_id }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: >-
            gcc:p clang:p cmake:p ninja:p pkgconf:p ffmpeg:p zlib:p
            python:p python-gobject:p python-cairo:p gtk3:p SDL2:p libarchive:p
      - name: Download the prior published Windows compiler kit
        if: ${{ env.COMPILER_VERSION != '' || env.COMPILER_SHA256 != '' || env.COMPILER_BUILD_ID != '' }}
        shell: pwsh
        run: |
          if ($env:COMPILER_VERSION -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:COMPILER_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:COMPILER_BUILD_ID -cnotmatch '^[0-9a-f]{24}$') {
            throw 'Provide the prior version, lowercase ZIP SHA-256 and compiler build_id together'
          }
          $version = $env:COMPILER_VERSION.TrimStart('v')
          $zip = "ShadowOfTheColossusPC-$version-windows-x86_64.zip"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:COMPILER_VERSION/$zip"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP 'sotc-previous-windows.zip')
      - name: Check that the prior compiler inputs are unchanged
        if: ${{ env.COMPILER_VERSION != '' }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$COMPILER_VERSION"
          git diff --exit-code FETCH_HEAD HEAD -- PS2Recomp game \
            tools/build_elf.py tools/elfmini.py tools/funcmap_elf.py tools/gen_config.py tools/xff.py tools/modimage.py \
            tools/desktop/pipeline.py tools/linux/input_tool.cpp tools/linux/video_tool.cpp \
            tools/windows/CMakeLists.txt tools/windows/utf8.rc tools/windows/utf8.manifest \
            tools/windows/package.py tools/windows/compiler_manifest.py
      - name: Configure the native Windows build
        run: |
          cmake -S PS2Recomp -B build/windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-msse4.1 \
            -DPython3_EXECUTABLE="$(cygpath -am /ucrt64/bin/python.exe)" \
            -DPS2X_BUILD_WINDOWS_KIT=ON -DPS2X_BUILD_STUDIO=OFF -DGLFW_USE_HYBRID_HPG=ON \
            -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF \
            -DPS2X_ENABLE_IOP_RPC_TRACE=OFF
      - name: Build the native launcher and any required compiler targets
        run: |
          targets=(ShadowOfTheColossusPC sotc-thread-load-test sotc-windows-state-file-test)
          if [[ -z "$COMPILER_VERSION" ]]; then
            targets+=(ps2_recomp sotc-windows-base sotc-video-tool sotc-input-tool)
          fi
          cmake --build build/windows --parallel 2 --target "${targets[@]}"
          build/windows/ps2xRuntime/sotc-thread-load-test.exe
          build/windows/ps2xRuntime/sotc-windows-state-file-test.exe \
            "$(cygpath -am "$RUNNER_TEMP")/sotc-state-file-check"
      - name: Package native launcher and compiler
        run: |
          reuse=()
          if [[ -n "$COMPILER_VERSION" ]]; then
            reuse+=(--reuse-compiler "$(cygpath -am "$RUNNER_TEMP")/sotc-previous-windows.zip"
                    --compiler-sha256 "$COMPILER_SHA256" --compiler-build-id "$COMPILER_BUILD_ID")
          fi
          /ucrt64/bin/python.exe -X utf8 tools/windows/package.py \
            --build build/windows --prefix /ucrt64 --destination dist/windows "${reuse[@]}"
      - name: Relocate package outside the source tree
        id: relocated
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/windows/*.zip).FullName
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive).Hash -ne $expected) { throw 'Package SHA-256 mismatch' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'SotC relocated package á 文字'
          Expand-Archive -LiteralPath $archive -DestinationPath $testRoot
          "SOTC_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
      - name: Open the relocated launcher and graphics profiles
        if: ${{ !cancelled() && steps.relocated.outcome == 'success' }}
        shell: pwsh
        run: |
          $testRoot = $env:SOTC_TEST_ROOT
          $program = Join-Path $testRoot 'ShadowOfTheColossusPC'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $shots = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-launcher'
          New-Item -Path $shots -ItemType Directory -Force | Out-Null
          foreach ($probe in @(@{language='en'; page='home'}, @{language='ja'; page='home'}, @{language='en'; page='graphics'})) {
            $language = $probe.language
            $page = $probe.page
            $profile = Join-Path $testRoot "player-$language"
            $image = Join-Path $shots "$page-$language.png"
            New-Item -Path $profile -ItemType Directory -Force | Out-Null
            @{ language = $language } | ConvertTo-Json |
              Set-Content -Encoding utf8NoBOM (Join-Path $profile 'launcher-preferences.json')
            $launcher = Start-Process -FilePath "$program/ShadowOfTheColossusPC.exe" -PassThru `
              -ArgumentList "--data-dir `"$profile`" --page $page --screenshot `"$image`""
            $finished = $launcher.WaitForExit(60000)
            if (!$finished) {
              & "$env:SystemRoot\System32\taskkill.exe" /PID $launcher.Id /T /F | Out-Null
            }
            $log = Join-Path $profile 'last-launcher.log'
            if (Test-Path $log) { Copy-Item $log (Join-Path $shots "$page-$language.log") }
            if (!$finished) { throw 'Launcher timed out' }
            if ($launcher.ExitCode -ne 0 -or !(Test-Path $image) -or (Get-Item $image).Length -le 1000) {
              Get-Content $log -ErrorAction SilentlyContinue
              throw "Launcher screenshot ($page, $language) failed, exit code $($launcher.ExitCode)"
            }
          }
          if ((Get-FileHash "$shots/home-en.png").Hash -eq (Get-FileHash "$shots/home-ja.png").Hash) {
            throw 'English and Japanese launcher screenshots were identical'
          }
          & "$program/compiler/toolchain/bin/python.exe" -X utf8 tools/linux/test_launcher_prepare.py `
            --program "$program/ShadowOfTheColossusPC.exe" --out (Join-Path $shots 'prepare-check')
          if ($LASTEXITCODE -ne 0) { throw 'Compile without launch regression check failed' }
          & "$program/compiler/toolchain/bin/python.exe" -X utf8 tools/linux/test_launcher_motion.py `
            --program "$program/ShadowOfTheColossusPC.exe" --out (Join-Path $shots 'motion-check')
          if ($LASTEXITCODE -ne 0) { throw 'Mouse, menu and focus regression check failed' }
      - name: Compile and run a fixture with the relocated kit
        if: ${{ !cancelled() && steps.relocated.outcome == 'success' }}
        shell: pwsh
        run: |
          $program = Join-Path $env:SOTC_TEST_ROOT 'ShadowOfTheColossusPC'
          $bin = Join-Path $program 'compiler/toolchain/bin'
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = Join-Path $program 'compiler/toolchain'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          & "$bin/python.exe" -X utf8 tools/linux/test_compiler.py --program $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/python.exe" -X utf8 tests/windows/test_unicode_prepare.py --program $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/python.exe" -X utf8 -m unittest discover -s tests/windows -p 'test_compiler_manifest.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/python.exe" -X utf8 tools/desktop/release/test_recomplauncher.py --program $program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$program/compiler/bin/ps2_recomp.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reuse valid Windows cache fixtures from the prior build ID
        if: ${{ !cancelled() && steps.relocated.outcome == 'success' && env.COMPILER_VERSION != '' }}
        shell: pwsh
        run: |
          $program = Join-Path $env:SOTC_TEST_ROOT 'ShadowOfTheColossusPC'
          $prefix = Join-Path $program 'compiler/toolchain'
          $env:PATH = "$prefix/bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = $prefix
          $env:PYTHONDONTWRITEBYTECODE = '1'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile

          program = Path(sys.argv[1])
          sys.path.insert(0, str(program / 'desktop'))
          from pipeline import BOOT, PAL_BOOT, Pipeline

          with tempfile.TemporaryDirectory(prefix='sotc prior cache ') as folder:
              data = Path(folder)
              for edition in (BOOT, PAL_BOOT):
                  work = data / 'builds' / os.environ['COMPILER_BUILD_ID']
                  if edition == PAL_BOOT:
                      work /= 'SCES-53326'
                  executable = work / 'gamecore/game.exe'
                  executable.parent.mkdir(parents=True)
                  executable.write_bytes(b'prior Windows cache fixture')
                  marker = work / 'complete.json'
                  marker.write_text(json.dumps({'sha256': hashlib.sha256(executable.read_bytes()).hexdigest()}))
                  before = [path.stat().st_mtime_ns for path in (executable, marker)]
                  pipeline = Pipeline(program, data, os.environ, boot_name=edition)
                  assert pipeline.prepare(data / 'disc fixture') == executable
                  assert all(path.stat().st_mtime_ns == timestamp for path, timestamp in zip((executable, marker), before))
                  assert not pipeline.log.exists()
                  print(f'Reused unchanged {edition} cache for {pipeline.build_id}')
          '@ | & "$prefix/bin/python.exe" -X utf8 - $program
          if ($LASTEXITCODE -ne 0) { throw 'Prior Windows cache reuse failed' }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Windows launcher screenshots
          path: artifacts/windows-launcher/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        # Keep candidates for diagnosis. Only successful builds are released.
        if: ${{ !cancelled() }}
        with:
          name: ShadowOfTheColossusPC-windows-x86_64
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: ignore
